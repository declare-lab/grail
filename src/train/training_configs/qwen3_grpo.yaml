# Model arguments
# model_init_kwargs:
model_name_or_path: Qwen/Qwen3-4B # change this
model_revision: main
dtype: bfloat16
trust_remote_code: true
attn_implementation: flash_attention_2

# Data training arguments
dataset_mixer:
  "trl-lib/DeepMath-103K": 1.0
dataset_splits:
  - train
  - test
preprocessing_num_workers: 1
truncation_side: "left"
padding_side: "left"
wandb_project: "GRAIL"

# GRPO trainer config
# Output and Run Configuration
output_dir: ./models/qwen3-4b-grpo-run1 # change this
overwrite_output_dir: true
run_name: qwen3-4b-grpo-run1 #change this
report_to:
  - wandb
save_strategy: "steps"
save_steps: 50
save_only_model: true
save_total_limit: 2

# Training Configuration
max_steps: 200
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 1.0e-06
optim: adamw_torch_fused
lr_scheduler_type: constant

warmup_steps: 20
max_grad_norm: 1.0
seed: 42
shuffle_dataset: true
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

beta: 0
num_iterations: 4
epsilon: 0.2
epsilon_high: 0.28
scale_rewards: false
loss_type: "dr_grpo"
mask_truncated_completions: true
use_liger_kernel: false

use_grail: false
use_oar_g: false

# Evaluation Configuration
do_eval: false

# Logging Configuration
logging_first_step: true
log_level: info
logging_steps: 5
logging_strategy: steps
log_completions: true
num_completions_to_print: 2
log_unique_prompts: true

# Generation Configuration
disable_dropout: true
max_completion_length: 4096
num_generations: 8
temperature: 1.0
top_p: 1.0
top_k: 50
repetition_penalty: 1.0
use_vllm: True
vllm_gpu_memory_utilization: 0.2

chat_template_kwargs:
  enable_thinking: false
